# Everything this world says. Quiet and procedural: the table answers, the upstream
# repeats, and nothing volunteers what any of it means.
#
# The dark line does real work. In the session, with the listener idle, a player can be
# stuck with no way to guess the verb, so the line says the verb.

[player]
prompt = "> "

no_such_thing = "Nothing here answers to {noun}."
which_one = "Say which: {things}."
unknown_verb = "Nothing you know how to do is called {word}."
no_effect = "Nothing you can see changes."
needs_noun = "{verb} what?"
needs_direction = "{verb} where?"
already_done = "Already done. Nothing new comes back."

taken = "Copied."
dropped = "Dropped your copy."
not_portable = "That is not something you can copy."
carrying = "Copied so far: {things}."
carrying_nothing = "You have copied nothing yet."
you_can_see = "Here: {things}."
exits = "From here: {exits}."
nothing_special = "Nothing in it you have not already read."

no_way = "Nothing goes {dir} from here."
blocked = "That way does not open yet."
shut = "That way is closed now."
pitch_dark = "The session is a wall of arriving claims, too fast to read.\nIf you brought something that listens, this is the moment to START it."
too_dark = "You cannot make that out through the noise from here."

saved = "State written."
loaded = "State restored."
save_mismatch = "That state belongs to a different table."
save_missing = "Nothing saved."
goodbye = "You tear down the session."

help_exits = "From here: {dirs}."
help_verb = "{verb}: {nouns}."
help_always = "Anywhere: {verbs}."
help_short = "Short: {short}."
help_pair = "{short} for {long}"
