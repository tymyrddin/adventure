# Everything this world says. Quiet, procedural, after hours: the laptop answers, and
# nothing volunteers what any of it means.
#
# The dark line does real work. It is the one moment a player can be stuck with no way
# to guess the verb, so it says the verb.

[player]
prompt = "> "

no_such_thing = "Nothing here answers to {noun}."
which_one = "Say which: {things}."
unknown_verb = "Nothing you know how to do is called {word}."
no_effect = "Nothing you can see changes."
needs_noun = "{verb} what?"
needs_direction = "{verb} where?"
already_done = "Already done. Nothing new comes back."

taken = "Copied."
dropped = "Deleted your copy."
not_portable = "That is not something you can copy."
carrying = "Copied so far: {things}."
carrying_nothing = "You have copied nothing yet."
you_can_see = "Here: {things}."
exits = "From here: {exits}."
nothing_special = "Nothing in it you have not already read."

no_way = "Nothing goes {dir} from here."
blocked = "The way {dir} does not open."
shut = "The way {dir} is not open any more."
pitch_dark = "Nothing answers. You are working blind.\nIf you brought something that listens, this is the moment to START it."
too_dark = "You cannot see to do that from here."

saved = "State written."
loaded = "State restored."
save_mismatch = "That state belongs to a different night."
save_missing = "Nothing saved."
goodbye = "You close the laptop."

help_exits = "From here: {dirs}."
help_verb = "{verb}: {nouns}."
help_always = "Anywhere: {verbs}."
help_short = "Short: {short}."
help_pair = "{short} for {long}"
